
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Rent a Place</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Rent a Place</a>
    </header>
    <main class="main-container">
        <section class="auth-panel">
            <div class="auth-navigation">
                <button
                    type="button"
                    class="nav-button active"
                    id="btnLogin"
                    aria-selected="true"
                    aria-controls="login">
                    Entrar
                </button>
                <button
                    type="button"
                    class="nav-button"
                    id="btnCadastro"
                    aria-selected="false"
                    aria-controls="cadastro">
                    Criar conta
                </button>
            </div>
            <form id="login" class="auth-form">
                <div class="form-heading">
                    <h1>Bem-vindo!</h1>
                    <p>
                        Entre na sua conta.
                    </p>
                </div>
                <div class="form-group">
                    <label for="loginUsername">
                        Nome de usuário
                    </label>
                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Digite seu nome de usuário"
                        autocomplete="username"
                        required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">
                        Senha
                    </label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>
                </div>
                <button type="submit" class="submit-button">
                    Entrar
                </button>
                <p class="form-footer">
                    Não tem conta?
                    <button
                        type="button"
                        class="text-button"
                        id="linkCadastro">
                        Cadastre-se
                    </button>
                </p>
            </form>
            <form id="cadastro" class="auth-form" hidden>
                <div class="form-heading">
                    <h1>Crie sua conta</h1>
                    <p>
                        Cadastre-se para usar.
                    </p>
                </div>
                <div class="form-group">
                    <label for="cadastroUsername">
                        Nome de usuário
                    </label>
                    <input
                        type="text"
                        id="cadastroUsername"
                        name="username"
                        placeholder="Escolha um nome de usuário"
                        autocomplete="username"
                        required>
                </div>
                <div class="form-group">
                    <label for="cadastroEmail">
                        E-mail
                    </label>
                    <input
                        type="email"
                        id="cadastroEmail"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required>
                </div>
                <div class="form-group">
                    <label for="cadastroPassword">
                        Senha
                    </label>
                    <input
                        type="password"
                        id="cadastroPassword"
                        name="password"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required>
                </div>
                <button type="submit" class="submit-button">
                    Criar conta
                </button>
                <p class="form-footer">
                    Já tem conta?
                    <button
                        type="button"
                        class="text-button"
                        id="linkLogin">
                        Faça login
                    </button>
                </p>
            </form>
        </section>
    </main>
    <script>
        const frmLogin = document.querySelector('#login');
        const frmCadastro = document.querySelector('#cadastro');
        const btnLogin = document.querySelector('#btnLogin');
        const btnCadastro = document.querySelector('#btnCadastro');
        const linkLogin = document.querySelector('#linkLogin');
        const linkCadastro = document.querySelector('#linkCadastro');

        function mostrarFormulario(tipo) {
            const loginAtivo = tipo === 'login';
            frmLogin.hidden = !loginAtivo;
            frmCadastro.hidden = loginAtivo;
            btnLogin.classList.toggle('active', loginAtivo);
            btnCadastro.classList.toggle('active', !loginAtivo);
            btnLogin.setAttribute(
                'aria-selected',
                String(loginAtivo)
            );
            btnCadastro.setAttribute(
                'aria-selected',
                String(!loginAtivo)
            );
        }

        btnLogin.addEventListener('click', () => {
            mostrarFormulario('login');
        });

        btnCadastro.addEventListener('click', () => {
            mostrarFormulario('cadastro');
        });

        linkLogin.addEventListener('click', () => {
            mostrarFormulario('login');
        });

        linkCadastro.addEventListener('click', () => {
            mostrarFormulario('cadastro');
        });

        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const botao = frmLogin.querySelector(
                '.submit-button'
            );
            botao.disabled = true;
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: frmLogin.username.value,
                        password: frmLogin.password.value
                    })
                });
                if (response.status === 400) {
                    alert('Preencha todos os campos.');
                    return;
                }
                if (response.status === 404) {
                    alert('Usuário não existente.');
                    return;
                }
                if (response.status === 401) {
                    alert('Senha incorreta.');
                    return;
                }
                if (response.ok) {
                    window.location.href = '/home';
                    return;
                }
                alert('Não foi possível realizar o login.');
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o servidor.');
            } finally {
                botao.disabled = false;
            }
        });
        
        frmCadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const botao = frmCadastro.querySelector(
                '.submit-button'
            );
            botao.disabled = true;
            try {
                const response = await fetch('/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: frmCadastro.username.value,
                        email: frmCadastro.email.value,
                        password: frmCadastro.password.value
                    })
                });
                if (!response.ok) {
                    alert('Não foi possível criar sua conta.');
                    return;
                }
                const responseLogin = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: frmCadastro.username.value,
                        password: frmCadastro.password.value
                    })
                });
                if (responseLogin.ok) {
                    window.location.href = '/home';
                    return;
                }
                alert(
                    'Conta criada, mas não foi possível realizar o login.'
                );
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o servidor.');
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
