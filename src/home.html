<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <header>
        <h1>Rent a Place</h1>
        <div>
            <button id="btn-anunciar">Cadastrar imóvel</button>
        </div>
    </header>

    <main>
        <section id="area-imoveis">
            <h2>Imóveis disponíveis</h2>
        </section>

        <section id="area-cadastro" hidden>
            <h2>Anunciar imóvel</h2>

            <button id="btn-voltar" type="button">
                Voltar
            </button>


            <form id="form-imovel">
                <fieldset>
                    <legend>Endereço do imóvel</legend>

                    <label for="rua">Rua ou avenida:</label>
                    <input type="text" id="rua" name="rua" required>

                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" required>

                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento">

                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                    <label for="uf">Estado (UF):</label>
                    <input type="text" id="uf" name="uf" maxlength="2" required>
                </fieldset>

                <fieldset>
                    <legend>Características do imóvel</legend>

                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" required></textarea>

                    <label for="metragem">Metragem (m²):</label>
                    <input type="number" id="metragem" name="metragem" min="0" step="0.01" required>

                    <label for="qnt_quartos">Quantidade de quartos:</label>
                    <input type="number" id="qnt_quartos" name="qnt_quartos" min="0" step="1" required>

                    <label for="qnt_banheiros">Quantidade de banheiros:</label>
                    <input type="number" id="qnt_banheiros" name="qnt_banheiros" min="0" step="1" required>

                    <label for="qnt_garagem">Vagas de garagem:</label>
                    <input type="number" id="qnt_garagem" name="qnt_garagem" min="0" step="1" required>
                </fieldset>

                <fieldset>
                    <legend>Valores do imóvel</legend>

                    <label for="valor_aluguel">Valor do aluguel (R$):</label>
                    <input type="number" id="valor_aluguel" name="valor_aluguel" min="0" step="0.01" required>

                    <label for="valor_cond">Valor do condomínio (R$):</label>
                    <input type="number" id="valor_cond" name="valor_cond" min="0" step="0.01" required>

                    <label for="valor_iptu">Valor do IPTU (R$):</label>
                    <input type="number" id="valor_iptu" name="valor_iptu" min="0" step="0.01" required>
                </fieldset>

                <button type="submit">Cadastrar imóvel</button>
            </form>
        </section>
    </main>
    <script>
        const btnAnunciar = document.getElementById("btn-anunciar");
        const btnVoltar = document.getElementById("btn-voltar");
        const areaImoveis = document.getElementById("area-imoveis");
        const areaCadastro = document.getElementById("area-cadastro");
        const formImovel = document.getElementById("form-imovel");

        btnAnunciar.addEventListener("click", () => {
            areaImoveis.hidden = true;
            areaCadastro.hidden = false;
        });

        btnVoltar.addEventListener("click", () => {
            areaCadastro.hidden = true;
            areaImoveis.hidden = false;
        });

        formImovel.addEventListener("submit", async (event) => {
            event.preventDefault();
            const dados = Object.fromEntries(
                new FormData(formImovel).entries()
            );
            dados.numero = Number(dados.numero);
            dados.valor_aluguel = Number(dados.valor_aluguel);
            dados.valor_cond = Number(dados.valor_cond);
            dados.valor_iptu = Number(dados.valor_iptu);
            dados.metragem = Number(dados.metragem);
            dados.qnt_quartos = Number(dados.qnt_quartos);
            dados.qnt_banheiros = Number(dados.qnt_banheiros);
            dados.qnt_garagem = Number(dados.qnt_garagem);

            const resposta = await fetch("/imovel", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                alert("Imóvel cadastrado com sucesso!");
                formImovel.reset();
            } else {
                alert("Não foi possível cadastrar o imóvel.");
            }
        });

        async function init() {
            const response = await fetch("/login/user")
            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }
        }
        init()
    </script>
</body>

</html>
